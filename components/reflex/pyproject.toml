[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex"
version = "0.1.0"
description = "Reflex Autonomous Computer-Use Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "s6_harness", "artifacts", "docs"]
asyncio_mode = "strict"
