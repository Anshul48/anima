<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standard Form Fixture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="password"], textarea, select {
      width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
    }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>User Registration</h1>
  <form id="registration_form" action="/submit" method="POST">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="user@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>
    <div class="form-group">
      <label for="country_select">Country</label>
      <select id="country_select" name="country">
        <option value="us">United States</option>
        <option value="ca">Canada</option>
        <option value="uk">United Kingdom</option>
      </select>
    </div>
    <div class="form-group">
      <label for="bio">Biography</label>
      <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself"></textarea>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="remember_me" name="remember_me">
        Remember Me
      </label>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="terms_agree" name="terms">
        I agree to the Terms of Service
      </label>
    </div>
    <div class="form-group">
      <button type="submit" id="submit_btn" class="btn-primary">Submit</button>
      <button type="button" id="cancel_btn" class="btn-secondary">Cancel</button>
    </div>
  </form>
</body>
</html>
