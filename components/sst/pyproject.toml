[project]
name = "sst-engine"
version = "0.1.0"
description = "State Space Tree (SST) Asymmetric Dialectic MCTS Heuristic Search Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Advanced Agentic Coding Team" }]
keywords = ["mcts", "state-space-tree", "heuristic-search", "code-synthesis", "trace"]

dependencies = [
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "aiohttp>=3.9.5",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.5",
    "types-pyyaml>=6.0.12.20240311",
]

[project.scripts]
sst = "sst.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sst"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.ruff]
target-version = "py312"
line-length = 120
# Delivery snapshots and committed run evidence are not product code.
exclude = [".delivery", "docs/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
