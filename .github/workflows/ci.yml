name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all components
        run: pip install -r requirements/components-all.txt
      - name: Root import-map tests
        run: python -m pytest tests/ -q
      - name: Root quickstart example
        run: python examples/quickstart.py
      - name: Substrate quickstart
        run: python components/substrate/examples/quickstart.py
      - name: Substrate component tests
        run: python -m pytest components/substrate/tests/ -q
      - name: Secret scan (filenames)
        run: |
          git ls-files | grep -Ei '(\.env$|\.pem$|\.key$|id_rsa|/consented_trace)' \
            | grep -v '.env.example' && exit 1 || echo "filename scan clean"
