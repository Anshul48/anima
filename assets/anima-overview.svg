<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="anima-hero-title anima-hero-desc">
<title id="anima-hero-title">ANIMA: five reusable research components</title>
<desc id="anima-hero-desc">Five cards for substrate, SST, STC, entorhinal, and reflex, each independently installable with no shared runtime.</desc>
<rect width="1200" height="320" rx="16" fill="#f6f8fb"/>
<text x="60" y="62" font-family="sans-serif" font-size="34" font-weight="700" fill="#1a2744">ANIMA</text>
<text x="60" y="92" font-family="sans-serif" font-size="15" fill="#4a5a75">Reusable research components for attributable local computation.</text>
<g font-family="sans-serif">
<g><rect x="60" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#d5dde9"/><text x="76" y="152" font-size="16" font-weight="700" fill="#1a2744">substrate</text><text x="76" y="174" font-size="12" fill="#4a5a75">persistent project</text><text x="76" y="190" font-size="12" fill="#4a5a75">worlds · stdlib-only</text><text x="76" y="222" font-size="12" fill="#1f6feb">anima-substrate</text></g>
<g><rect x="276" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#d5dde9"/><text x="292" y="152" font-size="16" font-weight="700" fill="#1a2744">sst</text><text x="292" y="174" font-size="12" fill="#4a5a75">heuristic search ·</text><text x="292" y="190" font-size="12" fill="#4a5a75">dialectic MCTS</text><text x="292" y="222" font-size="12" fill="#1f6feb">sst-engine</text></g>
<g><rect x="492" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#d5dde9"/><text x="508" y="152" font-size="16" font-weight="700" fill="#1a2744">stc</text><text x="508" y="174" font-size="12" fill="#4a5a75">spec-to-code</text><text x="508" y="190" font-size="12" fill="#4a5a75">engineering</text><text x="508" y="222" font-size="12" fill="#1f6feb">stc</text></g>
<g><rect x="708" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#d5dde9"/><text x="724" y="152" font-size="16" font-weight="700" fill="#1a2744">entorhinal</text><text x="724" y="174" font-size="12" fill="#4a5a75">advisory temporal</text><text x="724" y="190" font-size="12" fill="#4a5a75">context</text><text x="724" y="222" font-size="12" fill="#1f6feb">entorhinal</text></g>
<g><rect x="924" y="120" width="200" height="150" rx="12" fill="#ffffff" stroke="#d5dde9"/><text x="940" y="152" font-size="16" font-weight="700" fill="#1a2744">reflex</text><text x="940" y="174" font-size="12" fill="#4a5a75">vision / perception</text><text x="940" y="190" font-size="12" fill="#4a5a75">for computer use</text><text x="940" y="222" font-size="12" fill="#1f6feb">reflex</text></g>
</g>
<text x="60" y="298" font-family="sans-serif" font-size="13" fill="#4a5a75">Each component installs, runs, and tests on its own. No shared server, no cross-component wiring, no hosted service.</text>
</svg>
